[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smfprimer"
version = "0.1.0"
description = "Primer design for single-molecule footprinting experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Joseph McKenna" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["biopython>=1.81", "primer3-py>=2.3.0"]

[project.scripts]
smfprimer = "smfprimer.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]
docs = ["mkdocs-material==9.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/smfprimer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
